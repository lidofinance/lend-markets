[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
names = true
sizes = true

# `evm_version = "paris"` is intentionally not set here because Vault V2 uses
# transient storage and requires a Cancun-compatible EVM during integration tests.
# via_ir = false is the compile target — contracts must fit the legacy pipeline.
# optimizer_runs is tuned for deploy size, not call gas: at 999999 the controller
# exceeds the EIP-170 24KB limit. 200 keeps it well under with negligible runtime cost.
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
# Per-test gas cap. The heap-settlement benchmark's largest drain runs ~0.8B gas — ~1.3B under
# coverage instrumentation — which overflows foundry's 2^30 default; 2^32 fits it on every runner.
gas_limit = 4294967296
fs_permissions = [
    { access = "read", path = "./out" },
    { access = "read", path = "./lib" },
    { access = "read", path = "./deployments" },
]

[profile.default.invariant]
runs = 1024
depth = 32
fail_on_revert = true

[profile.default.fmt]
wrap_comments = true
line_length = 120
single_line_statement_blocks = "single"

[lint]
exclude_lints = [
    "unaliased-plain-import",
    "asm-keccak256",
    "unwrapped-modifier-logic",
]
ignore = ["test/**/*.sol", "lib/**/*.sol", "src/proxy/OssifiableProxy.sol"]
