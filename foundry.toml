[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
names = true
sizes = true

# `evm_version = "paris"` is intentionally not set here because Vault V2 uses
# transient storage and requires a Cancun-compatible EVM during integration tests.
# via_ir = false is the compile target — contracts must fit the legacy pipeline.
# optimizer_runs is constrained by deploy size: at 999999 the controller exceeds
# the EIP-170 24KB limit; at the configured 200 it fits with via_ir = false.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
# The solvency simulations (test/simulation/) run a whole simulated month or year in one test call. On forge 1.8.3
# a 30-day forced-exit unwind can exceed the default gas_limit of 1_073_741_824.
gas_limit = "18446744073709551615"
fs_permissions = [
    { access = "read", path = "./out" },
    { access = "read", path = "./lib" },
    { access = "read", path = "./script/config" },
    { access = "read", path = "./test/acceptance" },
    { access = "read-write", path = "./deployed" },
]

[profile.default.invariant]
runs = 1024
depth = 32
fail_on_revert = true

[profile.default.fmt]
wrap_comments = true
line_length = 120
single_line_statement_blocks = "single"

[lint]
exclude_lints = [
    "unaliased-plain-import",
    "asm-keccak256",
    "unwrapped-modifier-logic",
]
ignore = ["test/**/*.sol", "lib/**/*.sol", "src/proxy/OssifiableProxy.sol"]
