<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" role="img" aria-label="Inflow and activation delay over time">
  <style>
    :root {
      --ink: #1b1e24;
      --grid: #b7bcc4;
      --inflow: #3f6fb0;
      --delay: #4f9a5c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e7e9ee;
        --grid: #565c66;
        --inflow: #7fa8de;
        --delay: #5fa06a;
      }
    }
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>
  <defs>
    <marker id="axisArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"></path>
    </marker>
  </defs>

  <!-- axes -->
  <line x1="60" y1="345" x2="60" y2="15" stroke="var(--ink)" stroke-width="1.6" marker-end="url(#axisArrow)"></line>
  <line x1="60" y1="345" x2="890" y2="345" stroke="var(--ink)" stroke-width="1.6" marker-end="url(#axisArrow)"></line>
  <text x="52" y="14" text-anchor="end" font-size="13" fill="var(--ink)">delay</text>
  <text x="66" y="14" font-size="13" fill="var(--ink)">inflow</text>
  <text x="862" y="368" font-size="13" fill="var(--ink)">time</text>

  <!-- reference levels -->
  <line x1="60" y1="45" x2="860" y2="45" stroke="var(--grid)" stroke-width="1.4" stroke-dasharray="7 5"></line>
  <text x="770" y="40" font-size="13" fill="var(--ink)">maxDelayInflow</text>

  <line x1="60" y1="170" x2="860" y2="170" stroke="var(--grid)" stroke-width="1.2" stroke-dasharray="2 4"></line>
  <text x="758" y="165" font-size="13" fill="var(--ink)">maxActivationDelay</text>

  <line x1="60" y1="305" x2="860" y2="305" stroke="var(--grid)" stroke-width="1.2" stroke-dasharray="2 4"></line>
  <text x="762" y="300" font-size="13" fill="var(--ink)">minActivationDelay</text>

  <!-- deposit markers -->
  <g stroke="var(--ink)" stroke-width="1.3" stroke-dasharray="5 4" opacity="0.65">
    <line x1="140" y1="345" x2="140" y2="60"></line>
    <line x1="205" y1="345" x2="205" y2="60"></line>
    <line x1="440" y1="345" x2="440" y2="60"></line>
  </g>
  <text x="140" y="392" text-anchor="middle" font-size="13" fill="var(--ink)">Deposit</text>
  <text x="205" y="392" text-anchor="middle" font-size="13" fill="var(--ink)">Deposit</text>
  <text x="440" y="392" text-anchor="middle" font-size="13" fill="var(--ink)">Deposit</text>

  <!-- inflow (dotted, decays to zero, ratchets up on deposit, clamped at maxDelayInflow) -->
  <g fill="none" stroke="var(--inflow)" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="0.5 6">
    <path d="M140,365 V95"></path>
    <path d="M140,95 L205,120"></path>
    <path d="M205,120 V45"></path>
    <path d="M205,45 L440,172"></path>
    <path d="M440,172 V153"></path>
    <path d="M440,153 L845,345"></path>
  </g>
  <g fill="var(--inflow)">
    <circle cx="140" cy="365" r="4.5"></circle>
    <circle cx="140" cy="95" r="4.5"></circle>
    <circle cx="205" cy="120" r="4.5"></circle>
    <circle cx="205" cy="45" r="4.5"></circle>
    <circle cx="440" cy="172" r="4.5"></circle>
    <circle cx="440" cy="153" r="4.5"></circle>
  </g>
  <text x="205" y="30" text-anchor="middle" font-size="13" fill="var(--ink)">clamped</text>

  <!-- delay (solid, ratchets up on deposit, decays toward the floor) -->
  <path d="M60,305 L140,305 L140,205 L205,225 L205,180 L440,270 L440,250 L600,305 L860,305"
        fill="none" stroke="var(--delay)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"></path>
  <g fill="var(--delay)">
    <circle cx="60" cy="305" r="4.5"></circle>
    <circle cx="140" cy="305" r="4.5"></circle>
    <circle cx="205" cy="225" r="4.5"></circle>
    <circle cx="440" cy="270" r="4.5"></circle>
    <circle cx="600" cy="305" r="4.5"></circle>
  </g>
</svg>
