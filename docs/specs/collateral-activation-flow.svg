<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 880 252" width="880" height="252" role="img" aria-label="Collateral activation flow: Dust, Activating, Active">
  <style>
    :root {
      --ink: #1b1e24;
      --dust-fill: #eceef1;
      --dust-line: #9aa1ac;
      --activating-fill: #fdecc8;
      --activating-line: #c98a1f;
      --active-fill: #dcefdc;
      --active-line: #4f9a5c;
      --arrow: #3f6fb0;
      --arrow-fix: #b0563f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e7e9ee;
        --dust-fill: #2a2d33;
        --dust-line: #7d8590;
        --activating-fill: #3a2f18;
        --activating-line: #d9a441;
        --active-fill: #16321d;
        --active-line: #5fa06a;
        --arrow: #7fa8de;
        --arrow-fix: #e0876f;
      }
    }
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>
  <defs>
    <marker id="arrowIn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--arrow)"></path>
    </marker>
    <marker id="arrowInFix" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--arrow-fix)"></path>
    </marker>
  </defs>

  <!-- entry arrow: supplyCollateral(amount) -> Dust -->
  <text x="10" y="160" font-size="13" fill="var(--ink)">supplyCollateral(amount)</text>
  <line x1="10" y1="172" x2="216" y2="172" stroke="var(--ink)" stroke-width="1.6" marker-end="url(#arrowIn)"></line>

  <!-- boxes, clipped to the pill outline so Dust's left / Active's right corners round off instead of poking out -->
  <clipPath id="pillClip">
    <rect x="220" y="120" width="610" height="90" rx="14"></rect>
  </clipPath>
  <!-- Dust: 220-390, Activating: 390-570, Active: 570-830 -->
  <g clip-path="url(#pillClip)">
    <g stroke="var(--dust-line)" stroke-width="2">
      <rect x="220" y="120" width="170" height="90" fill="var(--dust-fill)"></rect>
    </g>
    <g stroke="var(--activating-line)" stroke-width="2">
      <rect x="390" y="120" width="180" height="90" fill="var(--activating-fill)"></rect>
    </g>
    <g stroke="var(--active-line)" stroke-width="2">
      <rect x="570" y="120" width="260" height="90" fill="var(--active-fill)"></rect>
    </g>
  </g>
  <!-- outer rounded frame -->
  <rect x="220" y="120" width="610" height="90" rx="14" fill="none" stroke="var(--ink)" stroke-width="2.5" opacity="0.55"></rect>

  <text x="305" y="171" text-anchor="middle" font-size="16" font-weight="600" fill="var(--ink)">Dust</text>
  <text x="480" y="171" text-anchor="middle" font-size="16" font-weight="600" fill="var(--ink)">Activating</text>
  <text x="700" y="171" text-anchor="middle" font-size="16" font-weight="600" fill="var(--ink)">Active</text>

  <!-- top bracket 1: stays Dust -->
  <text x="340" y="62" text-anchor="middle" font-size="13" fill="var(--arrow)">amount + dust &lt;</text>
  <text x="340" y="78" text-anchor="middle" font-size="13" fill="var(--arrow)">minActivationAmount</text>
  <path d="M320,88 H360" fill="none" stroke="var(--arrow)" stroke-width="1.6"></path>
  <path d="M320,88 V120" fill="none" stroke="var(--arrow)" stroke-width="1.6"></path>
  <path d="M360,88 V120" fill="none" stroke="var(--arrow)" stroke-width="1.6" marker-end="url(#arrowIn)"></path>

  <!-- top bracket 2: matures into Active -->
  <text x="610" y="62" text-anchor="middle" font-size="13" fill="var(--arrow)">delayed until the</text>
  <text x="610" y="78" text-anchor="middle" font-size="13" fill="var(--arrow)">maturation gate passes</text>
  <path d="M550,88 H670" fill="none" stroke="var(--arrow)" stroke-width="1.6"></path>
  <path d="M550,88 V120" fill="none" stroke="var(--arrow)" stroke-width="1.6"></path>
  <path d="M670,88 V120" fill="none" stroke="var(--arrow)" stroke-width="1.6" marker-end="url(#arrowIn)"></path>

  <!-- bottom bracket 1: promotes to Activating -->
  <text x="390" y="260" text-anchor="middle" font-size="13" fill="var(--arrow)">amount + dust &gt;=</text>
  <text x="390" y="276" text-anchor="middle" font-size="13" fill="var(--arrow)">minActivationAmount</text>
  <path d="M360,242 H420" fill="none" stroke="var(--arrow)" stroke-width="1.6"></path>
  <path d="M360,242 V210" fill="none" stroke="var(--arrow)" stroke-width="1.6"></path>
  <path d="M420,242 V210" fill="none" stroke="var(--arrow)" stroke-width="1.6" marker-end="url(#arrowIn)"></path>

  <!-- bottom bracket 2: instant activation into Active (caller allow-listed, not the borrower) -->
  <text x="590" y="260" text-anchor="middle" font-size="13" fill="var(--arrow-fix)">instant: if the supplying</text>
  <text x="590" y="276" text-anchor="middle" font-size="13" fill="var(--arrow-fix)">caller is allow-listed</text>
  <path d="M550,242 H630" fill="none" stroke="var(--arrow-fix)" stroke-width="1.6"></path>
  <path d="M550,242 V210" fill="none" stroke="var(--arrow-fix)" stroke-width="1.6"></path>
  <path d="M630,242 V210" fill="none" stroke="var(--arrow-fix)" stroke-width="1.6" marker-end="url(#arrowInFix)"></path>
</svg>
