name: Lido Lend regression tests
description: Prepare missing or inert markets on a fork of the supplied RPC and run the lending fork suites
inputs:
  rpc_url:
    description: Caller-prepared post-vote RPC to fork
    required: true
  repository:
    description: Lending repository to check out
    default: lidofinance/lend-markets
  ref:
    description: Lending revision with matching deployment artifacts and Solidity recipes
    default: main
  path:
    description: Checkout directory
    default: lend-markets
  config:
    description: Deprecated compatibility input; preparation uses Solidity recipes
    default: mainnet
  run:
    description: Recorded deployment under script/deployment/<run>/artifacts
    default: mainnet
runs:
  using: composite
  steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.ref }}
        path: ${{ inputs.path }}
        submodules: recursive
        persist-credentials: false
    - id: foundry
      shell: bash
      working-directory: ${{ inputs.path }}
      run: echo "version=$(head -n 1 .foundryref)" >> "$GITHUB_OUTPUT"
    - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
      with:
        version: ${{ steps.foundry.outputs.version }}
    - name: Prepare deployment and run regression tests
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        RPC_URL: ${{ inputs.rpc_url }}
        RUN: ${{ inputs.run }}
        TEST_SEED: '1'
      run: |
        fork_block=$(cast block-number --rpc-url "$RPC_URL")
        anvil --fork-url "$RPC_URL" --fork-block-number "$fork_block" \
          --fork-state-by-number --accounts 0 --no-mining \
          --host 127.0.0.1 --port 18545 --silent \
          > "$RUNNER_TEMP/lido-lend-anvil.log" 2>&1 &
        anvil_pid=$!
        trap 'kill "$anvil_pid" 2>/dev/null || true; wait "$anvil_pid" 2>/dev/null || true' EXIT
        export RPC_URL=http://127.0.0.1:18545
        for i in {1..60}; do
          kill -0 "$anvil_pid" 2>/dev/null || { echo "::error::Anvil exited before startup"; exit 1; }
          if [[ $(cast block-number --rpc-url "$RPC_URL" 2>/dev/null) == "$fork_block" ]]; then
            make test-fork RUN="$RUN"
            exit 0
          fi
          sleep 1
        done
        echo "::error::Anvil fork was not ready after 60 seconds"
        exit 1
