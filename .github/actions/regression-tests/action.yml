name: Lido Lend regression tests
description: Prepare missing or inert markets on a fork of the supplied RPC and run the lending fork suites
inputs:
  rpc_url:
    description: Caller-prepared post-vote RPC to fork
    required: true
  repository:
    description: Lending repository to check out
    default: lidofinance/lend-markets
  ref:
    description: Lending revision with matching deployment artifacts and configs
    default: main
  path:
    description: Checkout directory
    default: lend-markets
  config:
    description: Deployment configuration under script/config
    default: mainnet
  run:
    description: Existing protocol artifact run under deployed
    default: mainnet
runs:
  using: composite
  steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.ref }}
        path: ${{ inputs.path }}
        submodules: recursive
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - id: foundry
      shell: bash
      working-directory: ${{ inputs.path }}
      run: echo "version=$(head -n 1 .foundryref)" >> "$GITHUB_OUTPUT"
    - uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d # v1.8.0
      with:
        version: ${{ steps.foundry.outputs.version }}
    - name: Prepare deployment and run regression tests
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        RPC_URL: ${{ inputs.rpc_url }}
        CONFIG: ${{ inputs.config }}
        RUN: ${{ inputs.run }}
        TEST_SEED: '1'
      run: |
        python3 -m unittest discover -s tools/tests -p test_external_tests.py -v
        make test-external
