name: 'Repo setup'
description: 'Reads .foundryref and installs the pinned Foundry version. Assumes the repo is already checked out.'

runs:
  using: composite
  steps:
    - id: foundryref
      shell: bash
      run: echo "version=$(cat .foundryref)" >> $GITHUB_OUTPUT

    - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
      with:
        version: ${{ steps.foundryref.outputs.version }}

    - shell: bash
      run: forge --version
