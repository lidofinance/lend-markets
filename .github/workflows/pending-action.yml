name: pending-action

# Pre-signing validation of a pending multisig action: fork the live network, apply the
# transaction(s) from script/config/<config>/pending.toml, then verify the resulting state with state-mate
# and the fork suites. Every PR validates mainnet; manual runs can also select Hoodi.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      config:
        description: "network for the pending transaction and fork"
        type: choice
        options:
          - hoodi-testnet
          - mainnet
        default: "hoodi-testnet"
      state_mate_config:
        description: "Hoodi State Mate file; mainnet checks the full deployment directory"
        type: string
      deployment_run:
        description: "deployment under deployed/ for the fork suites (defaults to the selected network)"
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: select pending validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_validate: ${{ steps.check.outputs.should_validate }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - id: check
        name: always validate mainnet, check Hoodi for pending actions
        env:
          CONFIG: ${{ inputs.config || 'mainnet' }}
        run: |
          if [[ "$CONFIG" == mainnet ]] || grep -qE '^\[\[transaction\]\]' "script/config/$CONFIG/pending.toml"; then
            echo "should_validate=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_validate=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no active [[transaction]] in script/config/$CONFIG/pending.toml — nothing to validate"
          fi

  validate:
    name: apply pending action + state-mate + fork tests
    needs: guard
    if: needs.guard.outputs.should_validate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CONFIG: ${{ inputs.config || 'mainnet' }}
      STATE_MATE_CONFIG: ${{ inputs.state_mate_config || 'live.yaml' }}
      DEPLOYMENT_RUN: ${{ inputs.deployment_run || inputs.config || 'mainnet' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          submodules: recursive

      - uses: ./.github/actions/repo-setup

      - name: apply the pending action on a fork of the live network
        env:
          RPC_URL: &upstream_rpc ${{ secrets[inputs.config == 'hoodi-testnet' && 'HOODI_RPC_URL' || 'RPC_URL'] || (inputs.config != 'hoodi-testnet' && 'https://ethereum-rpc.publicnode.com') || '' }}
        run: |
          test -n "$RPC_URL" || { echo "::error::missing RPC secret for $CONFIG"; exit 1; }
          make apply-pending CONFIG="$CONFIG"
          # anvil keeps running on :8545 with the pending state applied

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          repository: lidofinance/state-mate
          ref: 835dbfeea055638c205338c777b8c2914289d799 # main 2026-09-11
          path: .state-mate

      - name: state-mate against the applied state
        working-directory: .state-mate
        env:
          HOODI_RPC_URL: http://127.0.0.1:8545
          MAINNET_RPC_URL: http://127.0.0.1:8545
          ETHERSCAN_TOKEN: ${{ secrets.ETHERSCAN_API_KEY }}
          ETHERSCAN_EXPLORER_TOKEN: ${{ secrets.ETHERSCAN_API_KEY }}
        run: |
          corepack enable
          yarn install --immutable
          if [[ "$CONFIG" == mainnet ]]; then
            config_dir="$GITHUB_WORKSPACE/deployed/mainnet/state-mate"
            test -f "$config_dir/mainnet.yaml"
            test -n "$(find "$config_dir/markets" -type f \( -name '*.yaml' -o -name '*.yml' \) ! -name '*.seed.*' -print -quit)"
            yarn start "$config_dir"
          else
            yarn start "$GITHUB_WORKSPACE/script/config/$CONFIG/state-mate/$STATE_MATE_CONFIG"
          fi

      - name: check mainnet NAV sources at the fork origin
        if: env.CONFIG == 'mainnet'
        env:
          RPC_URL: *upstream_rpc
        run: |
          # External NAV feeds cannot publish during a simulated 72-hour motion.
          source_block=$(cast rpc --rpc-url http://127.0.0.1:8545 anvil_nodeInfo | jq -er '.forkConfig.forkBlockNumber')
          FORK_BLOCK="$source_block" forge test --match-path test/fork/NavOracleSources.t.sol

      - name: fork suites against the applied state
        run: |
          if [[ "$CONFIG" == mainnet ]]; then
            # This suite ran above with its original feed timestamps.
            export FOUNDRY_NO_MATCH_PATH=test/fork/NavOracleSources.t.sol
          fi
          make test-fork PREPARE=false RPC_URL=http://127.0.0.1:8545 RUN="$DEPLOYMENT_RUN" FORK_BLOCK=

      - name: stop the fork
        if: always()
        run: make pending-stop
