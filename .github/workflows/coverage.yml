name: coverage

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: forge coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive

      - uses: ./.github/actions/repo-setup

      # `--ir-minimum` lets coverage instrument the bytecode while keeping via_ir for
      # compilation — turning via_ir off triggers stack-too-deep on the deleverage helpers.
      # The benchmark suite is skipped because its 100M+ gas tests blow up coverage time.
      - name: coverage
        run: forge coverage --ir-minimum --report summary --report lcov --report-file lcov.info --no-match-path 'test/integration/HeapDeleverageBenchmark.t.sol'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 14
