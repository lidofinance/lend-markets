name: coverage

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: forge coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - uses: ./.github/actions/repo-setup

      # `--ir-minimum` lets coverage instrument the bytecode while keeping via_ir for
      # compilation — turning via_ir off triggers stack-too-deep on the deleverage helpers.
      # The whole suite runs, fork suites included: they fork mainnet with `RPC_URL` from the
      # matching secret (same wiring as ci.yml's fork job) and revert if it is broken;
      # the guard below turns a missing secret into a clear CI error instead.
      - name: coverage
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
          NETWORK: mainnet
        run: |
          test -n "$RPC_URL" || { echo "::error::RPC_URL secret required for the coverage job"; exit 1; }
          forge coverage --ir-minimum --report summary --report lcov --report-file lcov.info

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 14
