name: fuzz

# Heavy fuzz/invariant suite. Runs nightly and on-demand.
# Kept off the PR path because high run counts slow down feedback.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  fuzz:
    name: deep fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive

      - uses: ./.github/actions/repo-setup

      - name: deep fuzz (10000 runs)
        env:
          FOUNDRY_FUZZ_RUNS: '10000'
        run: forge test --match-test 'testFuzz_'

      - name: invariant (longer than default)
        env:
          FOUNDRY_INVARIANT_RUNS: '4096'
          FOUNDRY_INVARIANT_DEPTH: '64'
        run: forge test --match-test 'invariant_'
