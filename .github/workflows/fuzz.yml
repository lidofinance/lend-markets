name: fuzz

# Heavy fuzz/invariant suite.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: deep fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          submodules: recursive

      - uses: ./.github/actions/repo-setup

      - name: build deployment dependencies
        run: make build-deps

      - name: deep fuzz (10000 runs)
        env:
          FOUNDRY_FUZZ_RUNS: '10000'
        run: forge test --no-match-path 'test/{fork,deployment}/**' --match-test 'testFuzz_'

      - name: invariant (longer than default)
        env:
          FOUNDRY_INVARIANT_RUNS: '4096'
          FOUNDRY_INVARIANT_DEPTH: '64'
        run: forge test --no-match-path 'test/{fork,deployment}/**' --match-test 'invariant_'

      - name: solvency simulations (365 days)
        run: make test-simulation
