name: static-analysis

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  slither:
    name: slither
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive

      - uses: ./.github/actions/repo-setup

      - name: install slither
        run: |
          python3 -m pip install --upgrade pip
          pip install slither-analyzer==0.10.4

      - name: build
        run: forge build --force

      - name: slither
        id: slither
        continue-on-error: true
        run: |
          set -o pipefail
          slither . \
            --foundry-out-directory out \
            --config-file slither.config.json \
            --fail-medium 2>&1 | tee slither.log

      - name: upload slither log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: slither-log
          path: slither.log

      - name: append slither output to job summary
        if: always()
        run: |
          {
            echo '## Slither'
            echo
            echo '<details><summary>Full log</summary>'
            echo
            echo '```'
            tail -c 60000 slither.log
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: fail on slither findings
        if: steps.slither.outcome == 'failure'
        run: exit 1

  solhint:
    name: solhint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: install solhint
        run: npm install -g solhint@5

      - name: solhint
        run: solhint 'src/**/*.sol'
