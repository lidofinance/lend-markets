name: static-analysis

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  slither:
    name: slither
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - uses: ./.github/actions/repo-setup

      - name: install slither
        run: |
          python3 -m pip install --upgrade pip
          pip install slither-analyzer==0.10.4

      - name: build
        run: forge build --force

      - name: slither
        id: slither
        continue-on-error: true
        run: |
          set -o pipefail
          slither . \
            --foundry-out-directory out \
            --config-file slither.config.json \
            --fail-medium 2>&1 | tee slither.log

      - name: upload slither log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slither-log
          path: slither.log

      - name: append slither output to job summary
        if: always()
        run: |
          {
            echo '## Slither'
            echo
            echo '<details><summary>Full log</summary>'
            echo
            echo '```'
            tail -c 60000 slither.log
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: fail on slither findings
        if: steps.slither.outcome == 'failure'
        run: exit 1

  solhint:
    name: solhint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: install solhint
        run: npm install -g solhint@5

      - name: solhint
        run: solhint 'src/**/*.sol'
