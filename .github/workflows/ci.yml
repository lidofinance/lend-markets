name: ci

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Local suites: unit + scenario + invariant. No RPC, no fork, deterministic — this is the gate that
  # must pass on every change and needs no secret.
  local:
    name: build + lint + local tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - uses: ./.github/actions/repo-setup

      - name: build (with sizes)
        run: forge build --sizes

      - name: lint
        run: make lint

      - name: test (local, excludes test/fork/)
        run: make test

  # Fork suites under test/fork/. They self-fork (see test/fork/helpers/ForkTest.sol) from ETH_RPC_URL and read
  # addresses from DEPLOYMENT — no --fork-url flag. foundry-toolchain caches ~/.foundry/cache by default.
  fork:
    name: fork tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - uses: ./.github/actions/repo-setup

      # The fork suites are network-blind: they fork ETH_RPC_URL and read addresses from DEPLOYMENT. This job
      # picks mainnet purely by what it provides (a mainnet RPC + the mainnet address map). To cover another
      # network, add a job with that network's RPC and its deployments/deployed-<network>.json.
      # Fork tests skip themselves without an RPC; in CI we want them to actually run, so fail loudly if the
      # secret is missing rather than pass a vacuous (all-skipped) job.
      - name: fork tests (mainnet)
        env:
          ETH_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
          DEPLOYMENT: deployments/deployed-mainnet.json
        run: |
          test -n "$ETH_RPC_URL" || { echo "::error::MAINNET_RPC_URL secret required for the fork job"; exit 1; }
          make fork-test
