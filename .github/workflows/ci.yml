name: ci

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local:
    name: build + lint + local tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - uses: ./.github/actions/repo-setup

      - name: build (with sizes)
        run: forge build --sizes

      - name: lint
        run: make lint

      - name: test (local, excludes test/fork/)
        run: make test-local

  fork:
    name: fork tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - uses: ./.github/actions/repo-setup

      - name: fork tests (mainnet)
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
          NETWORK: mainnet
        run: |
          test -n "$RPC_URL" || { echo "::error::RPC_URL secret required for the fork job"; exit 1; }
          make test-fork
