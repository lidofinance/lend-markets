name: ci

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local:
    name: build + lint + local tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          submodules: recursive

      - uses: ./.github/actions/repo-setup

      # Only src and the Bundler3 anchor: test harnesses and handlers exceed EIP-170 by design, and the
      # tests deploy Bundler3 from the artifact the anchor produces.
      - name: build (with sizes)
        run: forge build src script/Bundler3Anchor.sol --sizes

      - name: lint
        run: make lint

      - name: test (local, excludes test/fork/)
        run: make test-local

  fork:
    name: fork tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          submodules: recursive

      - uses: ./.github/actions/repo-setup

      - name: provision a fork deployment
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
        run: |
          test -n "$RPC_URL" || { echo "::error::RPC_URL secret required for the fork job"; exit 1; }
          make provision-fork

      - name: fork tests (against the provisioned deployment)
        run: make test-fork RPC_URL=http://127.0.0.1:8545 ARTIFACTS_DIR=fork
