# Hoodi testnet deploy — production-path rehearsal.
# The real Hoodi governance stack holds the governance roles (Aragon Agent /
# EasyTrack EVMScriptExecutor / Dual Governance ResealManager, docs.lido.fi), so activation and
# management run as EasyTrack motions. Mock USDY / NAV / stable feeds are already deployed on Hoodi and
# reused. Their addresses are set in the oracle/market configs.
# Exit books deploy with the protocol with EMPTY source allowlists (rollout is a separate step).
network = "hoodi"
chain_id = 560048

agent = "0x0534aA41907c9631fae990960bCC72d75fA7cfeD"                # Aragon Agent (hoodi, docs.lido.fi)
evm_script_executor = "0x79a20FD0FA36453B2F45eAbab19bfef43575Ba9E"  # EasyTrack EVMScriptExecutor (hoodi, docs.lido.fi)
circuit_breaker_artifact = "lido-lend"
reseal_manager = "0x05172CbCDb7307228F781436b327679e4DAE166B"       # ResealManager, Dual Governance (hoodi, docs.lido.fi)

exit_books = true
exit_book_pauser = "0xe65b86bB03Bd1B11BF39C6d87060c7A52236988D"     # Risk Steward Committee Safe (differs from deployer/agent/executor)
pauser_committee = "0x8223d372898CA8f185F24b5EDA373FDaea16B1c6"     # Pauser committee (CircuitBreaker) Safe, registered by the activation
risk_steward = "0xe65b86bB03Bd1B11BF39C6d87060c7A52236988D"         # Risk Steward Committee: appointed per market by the activation motion (state-mate expectation)
exit_book_max_request_lifetime = 7776000                            # 90 days

# Externals for the fork suites (`_ext`). config_hash is provenance only; artifact compatibility is
# checked on compatibility_hash (network, chain_id, agent, executor, reseal_manager, cb artifact).
# usdyBlocklist has no hoodi counterpart — the USDY mock carries no blocklist.
# What a run of this config deploys, in the order the scripts require. Read by `make deploy-all`.
[provision]
oracles = ["hoodi-weth-wsteth", "hoodi-usdy-usdt", "hoodi-usdy-usdc"]
guardians = ["hoodi-shared"]
markets = ["hoodi-weth-wsteth", "hoodi-usdt-usdy", "hoodi-usdc-usdy"]

[external]
weth = "0xE69a5c6dd88cA798b93c3C92fc50c51Fd5305eB4"
stEth = "0x3508A952176b3c15387C97BE809eaffB1982176a"
wstEth = "0x7E99eE3C66636DE415D2d7C880938F2f40f94De4"
usdy = "0xE22a71d42632aBAC08F44FCbd41221A8D8C56972"
usdt = "0x64f1904d1b419c6889BDf3238e31A138E258eA68"
usdc = "0x97bb030B93faF4684eAC76bA0bf3be5ec7140F36"
ondoOracle = "0xd6237FecDF9C1D9b023A5205C17549E3037EeEec"
usdtUsdFeed = "0xeC3785b13b21c226D66B5bC2E82BB2f4226f715e"
usdcUsdFeed = "0x9d156F7F5ed1fEbDc4996CAA835CD964A10bd650"
