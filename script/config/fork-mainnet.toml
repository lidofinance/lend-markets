# Local mainnet-fork provisioning only. Production deployments use mainnet.toml with the real committee.
network = "mainnet"
chain_id = 1

agent = "0x3e40D73EB977Dc6a537aF587D48316feE66E9C8c"
evm_script_executor = "0xFE5986E06210aC1eCC1aDCafc0cc7f8D63B3F977"
reseal_manager = "0x7914b5a1539b97Bd0bbd155757F25FD79A522d24"
circuit_breaker_artifact = "lido-lend"
exit_books = true
# Anvil's second development account; deliberately distinct from the deployer and governance accounts.
exit_book_pauser = "0x70997970C51812dc3A010C7d01b50e0d17dc79C8"
exit_book_max_request_lifetime = 31536000  # 365 days

# Test-only composition consumed by script/provision-fork.sh. Market configs still name their own oracle and
# guardian resources; vaults are standalone and therefore listed explicitly here.
[provision]
markets = ["fork-weth-wsteth", "fork-usdy-usdt"]
vaults = ["fork-weth-wsteth"]
