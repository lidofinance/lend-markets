# Pending multisig action for hoodi — the transaction(s) awaiting signing, exactly as they will be
# submitted on the live network. The calldata is encoded at the multisig boundary.
#
# Validation before signing: `make apply-pending CONFIG=hoodi-testnet RPC_URL=<live-rpc>` forks the live
# network, impersonates `from`, applies each transaction in order, and leaves the fork running on
# 127.0.0.1:8545 for `make test-fork` / state-mate. Empty file (no [[transaction]]) = nothing
# pending; apply-pending then just leaves a clean fork up. A transaction that creates an EasyTrack
# motion carries `motion_calldata`; the applier skips the objection window and enacts it with that
# calldata, so the fork ends in the motion's outcome.
#
# Activation of the hoodi-testnet run (deployed/hoodi-testnet): three LidoLendActivateMarket motions
# created by the trusted-caller Safe 0x4D8448CF02B84b6D3555e3667b3Ad259C75d8102, one per market.
# Exit-book allow-listing is a later, separate motion. from = the Safe; to = EasyTrack;
# data = createMotion(factory, motion_calldata).

