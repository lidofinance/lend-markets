kind = "usdy"
usdy_oracle = "0xd6237FecDF9C1D9b023A5205C17549E3037EeEec"       # Ondo NAV mock
feed = "0xeC3785b13b21c226D66B5bC2E82BB2f4226f715e"              # USDT/USD feed mock
loan_token = "0x64f1904d1b419c6889BDf3238e31A138E258eA68"        # USDT (hoodi, docs.lido.fi) — immutable per instance
