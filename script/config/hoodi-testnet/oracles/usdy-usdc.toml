# usdy-usdc oracle. The mocks are the ones already deployed on hoodi — reused, not redeployed.
kind = "usdy"
usdy_oracle = "0xd6237FecDF9C1D9b023A5205C17549E3037EeEec"       # Ondo NAV mock
feed = "0x9d156F7F5ed1fEbDc4996CAA835CD964A10bd650"              # USDC/USD feed mock
loan_token = "0x97bb030B93faF4684eAC76bA0bf3be5ec7140F36"        # USDC (hoodi, docs.lido.fi) — immutable per instance
collateral_token = "0xE22a71d42632aBAC08F44FCbd41221A8D8C56972"  # USDY mock
# Sanity band on the returned price (1e24 per 1 unit of loan-token value per USDY: 18-dec collateral,
# 6-dec loan). Wide like the fork band, not the mainnet one: the liquidation drill cuts the NAV mock to
# roughly half the live price, and a tighter floor would reject it as PriceOutOfBounds.
min_price = "100000000000000000000000"       # 0.1e24
max_price = "100000000000000000000000000"    # 100e24
