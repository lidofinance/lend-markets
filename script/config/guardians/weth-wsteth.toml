# GuardianSignals config for the WETH/wstETH market's registry, consumed by the deploy engine (via DeployProtocol /
# AddMarket). The registry is per-market, so markets can run under different guardian sets; the deployed
# address is slotted into the market by the orchestrator. Fill the guardian set before broadcast.

# The protocol's LidoLendMarketBuilder (from the protocol's deployed registry) — only read by the STANDALONE
# DeployGuardianSignals script (DeployProtocol / AddMarket already have a builder in scope and reuse it).
builder = "0x0000000000000000000000000000000000000000"

# Agent — final DEFAULT_ADMIN_ROLE (can re-grant any role; administers the registry).
admin = "0x3e40D73EB977Dc6a537aF587D48316feE66E9C8c"
# OssifiableProxy admin for the registry (upgrade authority).
proxy_admin = "0x3e40D73EB977Dc6a537aF587D48316feE66E9C8c"
# EVMScriptExecutor — MANAGER_ROLE (guardian set / quorum / suspect window) + ACCESS_RESTORER_ROLE
# (`unban`), so the EasyTrack guardian factories act on it through the objection window.
evm_script_executor = "0xFE5986E06210aC1eCC1aDCafc0cc7f8D63B3F977"

quorum = 1
suspect_window = 0

# Risk-steward committee — gets ACCESS_LIMITER_ROLE (`ban`, bypass quorum). Optional: omit or zero to leave the
# role for the DAO to grant post-deploy. Fork test: left unset. Same committee as the controller `freezer`.
access_limiter = "0x0000000000000000000000000000000000000000"

# The guardian set — addresses that may `flag` suspect accounts on this market. Fork test: the deployer
# (anvil account #0) is the sole guardian. Replace with the real set before any real broadcast.
guardians = ["0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"]  # deployer (anvil #0)
