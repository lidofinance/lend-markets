<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 636" width="1600" height="636" role="img" aria-labelledby="t d">
<title id="t">Joint verification scenes: several contracts compiled together</title>
<desc id="d">Joint verification scenes shown as cards. Each compiles several contracts together. The contract tagged REAL BYTECODE · SUBJECT OF THE SCENE is the one the scene is named for and checks; a contract tagged REAL BYTECODE is a linked neighbour whose own code runs. In LidoLend_LinkedController the rules that range over every entry point also cover the controller. A contract tagged COMPILED, NOT CALLED is in the scene for its state only: in Erc4626ExitBook_LinkedVaultCore the book reaches its vault through an address linked to nothing, so that call resolves into a CVL model, and neither the vault's code nor the core behind it is entered. A dashed box is a CVL model: it returns values and never calls out. Arrows always start at a real contract. Small chips along the bottom of a card are the background contracts modeled in that scene.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 L2.6 4 Z" fill="#485058"/></marker>
<pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#E4DFD2"/></pattern>
</defs>
